name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { printf 'gofmt: not formatted:\n%s\n' "$unformatted"; exit 1; }
      - name: vet
        run: go vet ./...
      - name: staticcheck
        run: |
          version=$(awk '$1 == "staticcheck" { print $2 }' scripts/tool-versions.txt)
          go install honnef.co/go/tools/cmd/staticcheck@"$version"
          staticcheck ./...
      - name: tree gate tests
        run: scripts/check-tree_test.sh
      - name: compiler tree
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          LEAK_TERMS_CONTENT: ${{ secrets.LEAK_TERMS }}
          CHECK_TREE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          printf '%s\n' "$LEAK_TERMS_CONTENT" > "$RUNNER_TEMP/leak-terms.txt"
          LEAK_TERMS="$RUNNER_TEMP/leak-terms.txt" scripts/check-tree.sh
      - name: public compiler tree on fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          for baseline in scripts/baselines/*.txt; do
            check=$(basename "$baseline" .txt)
            [ "$check" = publication ] || scripts/check-tree.sh --only "$check"
          done
      - name: test
        run: go test ./...
      - name: install Claude Code
        run: |
          version=$(awk '$1 == "claude-code" { print $2 }' scripts/tool-versions.txt)
          npm install -g @anthropic-ai/claude-code@"$version"
      - name: validate the marketplace
        run: claude plugin validate --strict .
      - name: validate the plugin
        run: claude plugin validate --strict plugins/engine-sync
      - name: leak gate
        # A fork's pull request gets no secrets; the gate runs on every push to develop and main.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          LEAK_TERMS_CONTENT: ${{ secrets.LEAK_TERMS }}
        run: |
          printf '%s\n' "$LEAK_TERMS_CONTENT" > "$RUNNER_TEMP/leak-terms.txt"
          LEAK_TERMS="$RUNNER_TEMP/leak-terms.txt" scripts/leak-check.sh

  release-version:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: execute native release asset and verify its version
        run: scripts/build-release.sh --native-only --out "$RUNNER_TEMP/release"
