name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the tag names plugin.json's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest="$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' plugins/engine-sync/.claude-plugin/plugin.json | head -n 1 | sed 's/^"version"[[:space:]]*:[[:space:]]*"//; s/"$//')"
          if [ "$version" != "$manifest" ]; then
            echo "tag $GITHUB_REF_NAME names $version, plugin.json says $manifest" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: every version place agrees and the committed sums match a fresh build
        run: scripts/release-check.sh --release
      - name: build the four assets
        run: scripts/build-release.sh
      - name: release notes from the changelog
        run: |
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          test -s notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/engine-sync_* dist/SHA256SUMS \
            --title "engine-sync $VERSION" --notes-file notes.md --verify-tag
